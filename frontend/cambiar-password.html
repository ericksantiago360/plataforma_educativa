<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar contraseña - Campus Virtual</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --secondary: #1e40af;
            --danger: #ef4444;
            --success: #10b981;
            --gray-200: #e5e7eb;
            --gray-700: #374151;
            --gray-900: #111827;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        body.cargando form {
            visibility: hidden;
        }

        .login-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 380px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
            text-align: center;
            margin-bottom: 0.25rem;
        }

        .subtitulo {
            text-align: center;
            color: var(--gray-700);
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--gray-900);
            margin-bottom: 0.4rem;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--gray-200);
            border-radius: 8px;
            font-size: 1rem;
            margin-bottom: 1.25rem;
        }

        input:focus {
            outline: 2px solid var(--primary);
            border-color: transparent;
        }

        .ayuda {
            color: var(--gray-700);
            font-size: 0.8rem;
            margin: -0.9rem 0 1.25rem;
        }

        button {
            width: 100%;
            padding: 0.85rem;
            border: none;
            border-radius: 8px;
            background: var(--primary);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: var(--secondary);
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .error {
            color: var(--danger);
            font-size: 0.9rem;
            margin-bottom: 1rem;
            min-height: 1.2em;
            white-space: pre-line;
        }

        .volver {
            display: block;
            text-align: center;
            margin-top: 1rem;
            font-size: 0.9rem;
            color: var(--primary);
        }
    </style>
</head>
<body class="cargando">
    <form class="login-card" id="password-form">
        <div class="logo">🎓 Campus Virtual</div>
        <p class="subtitulo" id="subtitulo">Cambiar contraseña</p>

        <label for="actual">Contraseña actual</label>
        <input id="actual" type="password" autocomplete="current-password" required autofocus>

        <label for="nueva">Contraseña nueva</label>
        <input id="nueva" type="password" autocomplete="new-password" minlength="8" required>
        <p class="ayuda">Al menos 8 caracteres, que no sea solo números ni una contraseña común.</p>

        <label for="confirmar">Confirma la contraseña nueva</label>
        <input id="confirmar" type="password" autocomplete="new-password" minlength="8" required>

        <p class="error" id="error" role="alert"></p>
        <button type="submit" id="guardar">Cambiar contraseña</button>
        <a class="volver" id="volver" href="index.html">Volver al campus</a>
    </form>

    <script src="js/auth.js"></script>
    <script>
        const form = document.getElementById('password-form');
        const error = document.getElementById('error');
        const boton = document.getElementById('guardar');

        // Sin sesión, al login. Con la contraseña temporal del alta, no se puede volver hasta cambiarla.
        api('/auth/me/').then(async r => {
            if (!r.ok) {
                window.location.replace('login.html');
                return;
            }
            const usuario = await r.json();
            if (usuario.debe_cambiar_password) {
                document.getElementById('subtitulo').textContent =
                    'Por seguridad, cambia la contraseña temporal que te dio Control Escolar antes de continuar';
                const volver = document.getElementById('volver');
                volver.textContent = 'Cerrar sesión';
                volver.addEventListener('click', e => {
                    e.preventDefault();
                    cerrarSesion();
                });
            }
            document.body.classList.remove('cargando');
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            error.textContent = '';
            if (form.nueva.value !== form.confirmar.value) {
                error.textContent = 'Las contraseñas nuevas no coinciden.';
                return;
            }
            boton.disabled = true;

            try {
                const r = await api('/auth/cambiar-password/', {
                    method: 'POST',
                    body: JSON.stringify({
                        password_actual: form.actual.value,
                        password_nueva: form.nueva.value,
                    }),
                });

                if (r.ok) {
                    boton.textContent = '✅ Contraseña cambiada';
                    setTimeout(() => window.location.replace('index.html'), 1200);
                    return;
                }
                const datos = await r.json().catch(() => ({}));
                error.textContent = r.status === 429
                    ? 'Demasiados intentos. Espera un minuto e inténtalo de nuevo.'
                    : [...(datos.password_actual || []), ...(datos.password_nueva || [])].join('\n')
                      || datos.detail || 'No se pudo cambiar la contraseña.';
            } catch {
                error.textContent = 'No hay conexión con el servidor.';
            }
            boton.disabled = false;
        });
    </script>
</body>
</html>
