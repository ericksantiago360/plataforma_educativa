<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Campus Virtual</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --secondary: #1e40af;
            --danger: #ef4444;
            --gray-200: #e5e7eb;
            --gray-700: #374151;
            --gray-900: #111827;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .login-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 380px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
            text-align: center;
            margin-bottom: 0.25rem;
        }

        .subtitulo {
            text-align: center;
            color: var(--gray-700);
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--gray-900);
            margin-bottom: 0.4rem;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--gray-200);
            border-radius: 8px;
            font-size: 1rem;
            margin-bottom: 1.25rem;
        }

        input:focus {
            outline: 2px solid var(--primary);
            border-color: transparent;
        }

        button {
            width: 100%;
            padding: 0.85rem;
            border: none;
            border-radius: 8px;
            background: var(--primary);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: var(--secondary);
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .error {
            color: var(--danger);
            font-size: 0.9rem;
            margin-bottom: 1rem;
            min-height: 1.2em;
        }
    </style>
</head>
<body>
    <form class="login-card" id="login-form">
        <div class="logo">🎓 Campus Virtual</div>
        <p class="subtitulo">Inicia sesión con la cuenta que te dio Control Escolar</p>

        <label for="usuario">Usuario</label>
        <input id="usuario" name="usuario" autocomplete="username" required autofocus>

        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <p class="error" id="error" role="alert"></p>
        <button type="submit" id="entrar">Entrar</button>
    </form>

    <script src="js/auth.js"></script>
    <script>
        const form = document.getElementById('login-form');
        const error = document.getElementById('error');
        const boton = document.getElementById('entrar');

        // Si ya hay sesión, ir directo al campus; si no, obtener la cookie CSRF para el login
        api('/auth/me/').then(r => {
            if (r.ok) window.location.replace('index.html');
            else api('/auth/csrf/');
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            error.textContent = '';
            boton.disabled = true;

            try {
                const r = await api('/auth/login/', {
                    method: 'POST',
                    body: JSON.stringify({
                        usuario: form.usuario.value.trim(),
                        password: form.password.value,
                    }),
                });

                const datos = await r.json().catch(() => ({}));
                if (r.ok) {
                    window.location.replace(datos.debe_cambiar_password ? 'cambiar-password.html' : 'index.html');
                    return;
                }
                error.textContent = r.status === 429
                    ? 'Demasiados intentos. Espera un minuto e inténtalo de nuevo.'
                    : (datos.detail || 'No se pudo iniciar sesión.');
            } catch {
                error.textContent = 'No hay conexión con el servidor.';
            }
            boton.disabled = false;
        });
    </script>
</body>
</html>
