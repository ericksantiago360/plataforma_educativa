user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    # Videos de hasta 200 MB en el contenido de materias (el backend valida el límite por tipo)
    client_max_body_size 210M;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Subidas grandes (videos) en conexiones lentas
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Adjuntos del contenido de materias. "internal": solo se llega aquí cuando Django,
        # tras revisar permisos, responde con X-Accel-Redirect. Desde fuera da 404.
        location /archivos-protegidos/ {
            internal;
            alias /srv/archivos/;
            # Con X-Accel-Redirect nginx solo conserva algunas cabeceras de Django (Content-Type,
            # Content-Disposition, Cache-Control…); esta se agrega aquí para que el navegador
            # nunca interprete un adjunto como otro tipo (por ejemplo, HTML).
            add_header X-Content-Type-Options nosniff always;
        }
    }
}
